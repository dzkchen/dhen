name: build
on: [pull_request, push]

# Cancel superseded runs on the same ref so a fresh push doesn't wait behind a
# stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: build
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew build 2>&1 | tee gradle-build.log; then exit 0; fi
            grep -qE 'Too Many Requests|status code 5[0-9][0-9]|Connection reset|Read timed out|Connection timed out' gradle-build.log \
              || exit 1
            echo "::warning::transient repository failure on attempt $attempt, retrying"
            sleep $((attempt * 30))
          done
          exit 1
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/
            addons/*/build/libs/
